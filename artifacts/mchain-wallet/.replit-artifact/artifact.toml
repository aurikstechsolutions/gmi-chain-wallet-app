kind = "mobile"
previewPath = "/"
title = "MChain Validator Wallet"
version = "1.0.0"
id = "artifacts/mchain-wallet"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/" ]
localPort = 20130

[services.development]
run = "EXPO_PUBLIC_WALLET_KEY=$WALLET_API_KEY pnpm --filter @workspace/mchain-wallet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mchain-wallet", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mchain-wallet", "run", "serve" ]

[services.env]
PORT = "20130"
BASE_PATH = "/"
